name: ZeroOne Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Pythonバージョン確認
        run: python --version

      - name: ZeroOneディレクトリへ移動
        working-directory: ZeroOne-V2.0.3
        run: python zo.py --version

      - name: Hello Worldをコンパイル
        working-directory: ZeroOne-V2.0.3
        run: python zo.py compile tests/hello.zo

      - name: Hello Worldを実行
        working-directory: ZeroOne-V2.0.3
        run: python zo.py run tests/hello.zbc
