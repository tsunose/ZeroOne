name: ZeroOne Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ZeroOne-V2

    steps:
      # ==========================================
      # 1. ソースコード取得
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python
        run: python --version

      # ==========================================
      # 3. ZeroOne CLI
      # ==========================================
      - name: Check ZeroOne
        run: python zo.py --help

      # ==========================================
      # 4. 基本コンパイルテスト
      # ==========================================
      - name: Create basic test
        run: |
          cat > ci_basic.zo <<'EOF'
          SET a = 10
          SET b = 20
          SET c = a + b
          OUT(c)
          EOF

      - name: Compile basic test
        run: python zo.py compile ci_basic.zo

      - name: Run basic test
        run: python zo.py run ci_basic.zbc

      # ==========================================
      # 5. 関数テスト
      # ==========================================
      - name: Create function test
        run: |
          cat > ci_function.zo <<'EOF'
          FUNC add(a, b)
              RETURN a + b
          END

          OUT(add(10, 20))
          EOF

      - name: Compile function test
        run: python zo.py compile ci_function.zo

      - name: Run function test
        run: python zo.py run ci_function.zbc

      # ==========================================
      # 6. 再帰テスト
      # ==========================================
      - name: Create recursion test
        run: |
          cat > ci_recursion.zo <<'EOF'
          FUNC factorial(n)
              WHEN n <= 1
                  RETURN 1
              END
              RETURN n * factorial(n - 1)
          END

          OUT(factorial(5))
          EOF

      - name: Compile recursion test
        run: python zo.py compile ci_recursion.zo

      - name: Run recursion test
        run: python zo.py run ci_recursion.zbc

      # ==========================================
      # 7. LOOPテスト
      # ==========================================
      - name: Create loop test
        run: |
          cat > ci_loop.zo <<'EOF'
          SET i = 0
          SET total = 0

          LOOP i < 10
              SET total = total + i
              SET i = i + 1
          END

          OUT(total)
          EOF

      - name: Compile loop test
        run: python zo.py compile ci_loop.zo

      - name: Run loop test
        run: python zo.py run ci_loop.zbc

      # ==========================================
      # 8. FORテスト
      # ==========================================
      - name: Create for test
        run: |
          cat > ci_for.zo <<'EOF'
          SET total = 0

          FOR SET i = 0; i < 10; SET i = i + 1
              SET total = total + i
          END

          OUT(total)
          EOF

      - name: Compile for test
        run: python zo.py compile ci_for.zo

      - name: Run for test
        run: python zo.py run ci_for.zbc

      # ==========================================
      # 9. FOREACH + NULL
      # ==========================================
      - name: Create foreach test
        run: |
          cat > ci_foreach.zo <<'EOF'
          SET arr = [1, 2, NULL, 4, 5]

          FOREACH x IN arr
              OUT(x)
          END
          EOF

      - name: Compile foreach test
        run: python zo.py compile ci_foreach.zo

      - name: Run foreach test
        run: python zo.py run ci_foreach.zbc

      # ==========================================
      # 10. LAMBDA
      # ==========================================
      - name: Create lambda test
        run: |
          cat > ci_lambda.zo <<'EOF'
          SET add = LAMBDA (x) => x + 1
          OUT(add(10))
          EOF

      - name: Compile lambda test
        run: python zo.py compile ci_lambda.zo

      - name: Run lambda test
        run: python zo.py run ci_lambda.zbc

      # ==========================================
      # 11. 外側変数を捕捉するLAMBDA
      # ==========================================
      - name: Create lambda capture test
        run: |
          cat > ci_lambda_capture.zo <<'EOF'
          SET offset = 100
          SET add_offset = LAMBDA (x) => x + offset
          OUT(add_offset(5))
          EOF

      - name: Compile lambda capture test
        run: python zo.py compile ci_lambda_capture.zo

      - name: Run lambda capture test
        run: python zo.py run ci_lambda_capture.zbc

      # ==========================================
      # 12. MAP / FILTER / REDUCE
      # ==========================================
      - name: Create higher order test
        run: |
          cat > ci_higher_order.zo <<'EOF'
          SET arr = [1, 2, 3, 4, 5]

          SET doubled = MAP(arr, LAMBDA (x) => x * 2)
          OUT(doubled)

          SET even = FILTER(arr, LAMBDA (x) => x % 2 == 0)
          OUT(even)

          SET total = REDUCE(arr, LAMBDA (a, b) => a + b)
          OUT(total)
          EOF

      - name: Compile higher order test
        run: python zo.py compile ci_higher_order.zo

      - name: Run higher order test
        run: python zo.py run ci_higher_order.zbc

      # ==========================================
      # 13. ビット演算
      # ==========================================
      - name: Create bitwise test
        run: |
          cat > ci_bitwise.zo <<'EOF'
          OUT(12 AND 10)
          OUT(12 OR 10)
          OUT(12 XOR 10)
          OUT(16 << 2)
          OUT(16 >> 2)
          OUT(16 >>> 2)
          EOF

      - name: Compile bitwise test
        run: python zo.py compile ci_bitwise.zo

      - name: Run bitwise test
        run: python zo.py run ci_bitwise.zbc

      # ==========================================
      # 14. SWITCH
      # ==========================================
      - name: Create switch test
        run: |
          cat > ci_switch.zo <<'EOF'
          SET value = 2

          SWITCH value
              CASE 1
                  OUT("ONE")
              CASE 2
                  OUT("TWO")
              CASE 3
                  OUT("THREE")
              DEFAULT
                  OUT("OTHER")
          END
          EOF

      - name: Compile switch test
        run: python zo.py compile ci_switch.zo

      - name: Run switch test
        run: python zo.py run ci_switch.zbc

      # ==========================================
      # 15. TRY / CATCH
      # ==========================================
      - name: Create exception test
        run: |
          cat > ci_exception.zo <<'EOF'
          TRY
              THROW "test"
          CATCH
              OUT("CAUGHT")
          END
          EOF

      - name: Compile exception test
        run: python zo.py compile ci_exception.zo

      - name: Run exception test
        run: python zo.py run ci_exception.zbc

      # ==========================================
      # 16. TRY / FINALLY
      # ==========================================
      - name: Create finally test
        run: |
          cat > ci_finally.zo <<'EOF'
          TRY
              OUT("TRY")
          FINALLY
              OUT("FINALLY")
          END
          EOF

      - name: Compile finally test
        run: python zo.py compile ci_finally.zo

      - name: Run finally test
        run: python zo.py run ci_finally.zbc

      # ==========================================
      # 17. STRUCT
      # ==========================================
      - name: Create struct test
        run: |
          cat > ci_struct.zo <<'EOF'
          STRUCT Test
              name
              value
          END
          EOF

      - name: Compile struct test
        run: python zo.py compile ci_struct.zo

      # ==========================================
      # 18. ENUM
      # ==========================================
      - name: Create enum test
        run: |
          cat > ci_enum.zo <<'EOF'
          ENUM TestEnum
              FIRST
              SECOND
              THIRD
          END
          EOF

      - name: Compile enum test
        run: python zo.py compile ci_enum.zo

      # ==========================================
      # 19. バイトコード往復テスト
      # ==========================================
      - name: Check bytecode output
        run: |
          test -f ci_basic.zbc
          test -f ci_function.zbc
          test -f ci_recursion.zbc
          test -f ci_loop.zbc
          test -f ci_for.zbc
          test -f ci_lambda.zbc

      # ==========================================
      # 20. 完了
      # ==========================================
      - name: All tests completed
        run: echo "ZeroOne automated tests completed successfully!"
